<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

    import {
        getFirestore,
        collection,
        getDocs,
        doc,
        getDoc
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";


    const firebaseConfig = {

        apiKey: "AIzaSyC7hjuWiRx3uBdfKAS3mj9na6zqO6xtQUY",

        authDomain: "palabra-secre.firebaseapp.com",

        projectId: "palabra-secre",

        storageBucket: "palabra-secre.firebasestorage.app",

        messagingSenderId: "1057501011597",

        appId: "1:1057501011597:web:ab2dd815a8ad9a293cccc4"

    };


    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);

    const appId = "palabra-secreta";


    const tbody =
        document.getElementById("leaderboard-body");

    const emptyMessage =
        document.getElementById("empty-message");

    const errorMessage =
        document.getElementById("error-message");

    const errorText =
        document.getElementById("error-text");


    async function loadRanking() {

        try {

            /*
            OBTENER TODOS LOS USUARIOS
            */

            const usersRef =
                collection(
                    db,
                    "artifacts",
                    appId,
                    "users"
                );


            const usersSnapshot =
                await getDocs(usersRef);


            console.log(
                "Usuarios encontrados:",
                usersSnapshot.size
            );


            const players = [];


            /*
            RECORRER CADA USUARIO
            */

            for (
                const userDoc
                of usersSnapshot.docs
            ) {

                const userId =
                    userDoc.id;


                /*
                ESTA ES LA RUTA REAL
                DONDE TU INDEX GUARDA
                LAS ESTADISTICAS
                */

                const statsRef =
                    doc(
                        db,
                        "artifacts",
                        appId,
                        "users",
                        userId,
                        "gameData",
                        "stats"
                    );


                const statsSnap =
                    await getDoc(
                        statsRef
                    );


                /*
                SI EL USUARIO NO TIENE
                ESTADISTICAS, CONTINUAR
                */

                if (
                    !statsSnap.exists()
                ) {

                    console.log(
                        "Sin estadísticas:",
                        userId
                    );

                    continue;

                }


                const stats =
                    statsSnap.data();


                console.log(
                    "Estadísticas encontradas:",
                    userId,
                    stats
                );


                /*
                LEER ESTADISTICAS
                */

                const won =
                    Number(
                        stats.won || 0
                    );


                const played =
                    Number(
                        stats.played || 0
                    );


                /*
                SI NO HA JUGADO
                NO ENTRA AL RANKING
                */

                if (
                    played <= 0
                ) {

                    continue;

                }


                /*
                NOMBRE DEL JUGADOR
                */

                const userData =
                    userDoc.data();


                const name =

                    userData.displayName ||

                    userData.name ||

                    stats.displayName ||

                    stats.name ||

                    "Jugador " +
                    userId.substring(
                        0,
                        6
                    );


                /*
                EFECTIVIDAD
                */

                const winRate =

                    (
                        won /
                        played
                    ) * 100;


                /*
                AGREGAR JUGADOR
                */

                players.push({

                    id:
                        userId,

                    name:
                        name,

                    won:
                        won,

                    played:
                        played,

                    winRate:
                        winRate

                });

            }


            /*
            ORDENAR
            */

            players.sort(

                (
                    a,
                    b
                ) =>

                    b.winRate -
                    a.winRate

                    ||

                    b.won -
                    a.won

            );


            console.log(
                "Jugadores válidos:",
                players
            );


            /*
            SI NO HAY JUGADORES
            */

            if (
                players.length === 0
            ) {

                tbody.innerHTML =
                    "";

                emptyMessage.classList.remove(
                    "hidden"
                );

                return;

            }


            /*
            OCULTAR MENSAJE VACIO
            */

            emptyMessage.classList.add(
                "hidden"
            );


            /*
            LIMPIAR TABLA
            */

            tbody.innerHTML =
                "";


            /*
            MOSTRAR JUGADORES
            */

            players.forEach(

                (
                    player,
                    index
                ) => {


                    const position =
                        index + 1;


                    let medal =
                        "#" +
                        position;


                    if (
                        position === 1
                    ) {

                        medal =
                            "🥇";

                    }


                    else if (
                        position === 2
                    ) {

                        medal =
                            "🥈";

                    }


                    else if (
                        position === 3
                    ) {

                        medal =
                            "🥉";

                    }


                    const row =
                        document.createElement(
                            "tr"
                        );


                    row.className =
                        "hover:bg-slate-900 transition-colors";


                    row.innerHTML = `

                        <td class="py-4 px-4 sm:px-6 font-bold">
                            ${medal}
                        </td>

                        <td class="py-4 px-4 sm:px-6 font-semibold text-slate-200">
                            ${escapeHtml(String(player.name))}
                        </td>

                        <td class="py-4 px-4 sm:px-6 text-center text-emerald-400 font-bold">
                            ${player.won}
                        </td>

                        <td class="py-4 px-4 sm:px-6 text-center text-slate-300">
                            ${player.played}
                        </td>

                        <td class="py-4 px-4 sm:px-6 text-right font-mono text-indigo-400">
                            ${player.winRate.toFixed(1)}%
                        </td>

                    `;


                    tbody.appendChild(
                        row
                    );

                }

            );


        }


        catch (
            error
        ) {

            console.error(
                "ERROR DEL RANKING:",
                error
            );


            tbody.innerHTML =
                "";


            errorMessage.classList.remove(
                "hidden"
            );


            errorText.textContent =
                error.message;

        }

    }


    function escapeHtml(
        text
    ) {

        return text

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            );

    }


    loadRanking();

</script>
