<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC7hjuWiRx3uBdfKAS3mj9na6zqO6xtQUY",
        authDomain: "palabra-secre.firebaseapp.com",
        projectId: "palabra-secre",
        storageBucket: "palabra-secre.firebasestorage.app",
        messagingSenderId: "1057501011597",
        appId: "1:1057501011597:web:ab2dd815a8ad9a293cccc4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const appId = "palabra-secreta";

    const tbody = document.getElementById("leaderboard-body");
    const emptyMessage = document.getElementById("empty-message");
    const errorMessage = document.getElementById("error-message");
    const errorText = document.getElementById("error-text");

    async function loadRanking() {
        try {
            const usersRef = collection(db, "artifacts", appId, "users");
            const usersSnapshot = await getDocs(usersRef);
            const players = [];

            usersSnapshot.forEach((userDoc) => {
                const data = userDoc.data();
                const userId = userDoc.id;

                const won = Number(data.won || 0);
                const played = Number(data.played || 0);

                if (played <= 0) return;

                const name = data.displayName || data.name || "Jugador " + userId.substring(0, 6);
                const winRate = played > 0 ? (won / played) * 100 : 0;

                players.push({ id: userId, name, won, played, winRate });
            });

            players.sort((a, b) => b.winRate - a.winRate || b.won - a.won);

            if (players.length === 0) {
                tbody.innerHTML = "";
                emptyMessage.classList.remove("hidden");
                return;
            }

            tbody.innerHTML = "";

            players.forEach((player, index) => {
                const position = index + 1;
                let medal = "#" + position;

                if (position === 1) medal = "🥇";
                if (position === 2) medal = "🥈";
                if (position === 3) medal = "🥉";

                const row = document.createElement("tr");
                row.className = "hover:bg-slate-900 transition-colors";
                row.innerHTML = `
                    <td class="py-4 px-4 sm:px-6 font-bold">${medal}</td>
                    <td class="py-4 px-4 sm:px-6 font-semibold text-slate-200">${escapeHtml(String(player.name))}</td>
                    <td class="py-4 px-4 sm:px-6 text-center text-emerald-400 font-bold">${player.won}</td>
                    <td class="py-4 px-4 sm:px-6 text-center text-slate-300">${player.played}</td>
                    <td class="py-4 px-4 sm:px-6 text-right font-mono text-indigo-400">${player.winRate.toFixed(1)}%</td>
                `;
                tbody.appendChild(row);
            });

        } catch (error) {
            console.error(error);
            tbody.innerHTML = "";
            errorMessage.classList.remove("hidden");
            errorText.textContent = error.message;
        }
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    loadRanking();
</script>
