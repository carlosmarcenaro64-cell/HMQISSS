<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ranking Global - Palabra Secreta</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url(
            'https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap'
        );

        body {
            font-family: 'Outfit', sans-serif;
        }

        .ranking-row {
            transition: 0.2s;
        }

        .ranking-row:hover {
            transform: scale(1.01);
        }
    </style>
</head>


<body
    class="min-h-screen bg-gradient-to-br from-indigo-950 via-purple-950 to-slate-950 text-white flex flex-col items-center p-4"
>


    <!-- =========================
         ENCABEZADO
    ========================== -->

    <header
        class="w-full max-w-2xl text-center mb-6"
    >

        <div
            class="flex items-center justify-between mb-6"
        >

            <button
                id="back-button"
                class="bg-white/10 hover:bg-white/20 border border-white/10 px-4 py-2 rounded-xl text-sm font-bold transition-all active:scale-95"
            >
                ← Volver
            </button>


            <span
                class="text-xs text-indigo-300"
            >
                Palabra Secreta
            </span>

        </div>


        <div
            class="text-5xl mb-2"
        >
            🏆
        </div>


        <h1
            class="text-3xl md:text-4xl font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-amber-400 to-pink-400"
        >
            RANKING GLOBAL
        </h1>


        <p
            class="text-indigo-200 text-sm mt-2"
        >
            Los mejores jugadores de Palabra Secreta
        </p>

    </header>



    <!-- =========================
         CONTENEDOR PRINCIPAL
    ========================== -->

    <main
        class="w-full max-w-2xl"
    >


        <!-- CARGANDO -->

        <div
            id="loading"
            class="bg-white/10 border border-white/10 rounded-2xl p-8 text-center"
        >

            <div
                class="text-4xl animate-bounce mb-3"
            >
                🏆
            </div>


            <p
                class="text-indigo-200"
            >
                Cargando ranking...
            </p>

        </div>



        <!-- TABLA -->

        <div
            id="ranking-container"
            class="hidden"
        >


            <!-- CABECERA -->

            <div
                class="grid grid-cols-5 gap-2 text-center text-[10px] md:text-xs text-indigo-300 font-bold uppercase mb-2 px-3"
            >

                <div>
                    Pos.
                </div>


                <div>
                    Jugador
                </div>


                <div>
                    Ganadas
                </div>


                <div>
                    Jugadas
                </div>


                <div>
                    % Victoria
                </div>

            </div>



            <!-- LISTA -->

            <div
                id="ranking-list"
                class="space-y-2"
            >
            </div>

        </div>



        <!-- SIN JUGADORES -->

        <div
            id="empty-ranking"
            class="hidden bg-white/10 border border-white/10 rounded-2xl p-8 text-center"
        >

            <div
                class="text-5xl mb-3"
            >
                🎮
            </div>


            <h2
                class="text-xl font-bold"
            >
                Aún no hay jugadores
            </h2>


            <p
                class="text-indigo-300 text-sm mt-2"
            >
                ¡Sé el primero en entrar al ranking!
            </p>

        </div>



        <!-- ERROR -->

        <div
            id="error-box"
            class="hidden bg-red-500/10 border border-red-500/30 rounded-2xl p-6 text-center"
        >

            <div
                class="text-3xl mb-2"
            >
                ⚠️
            </div>


            <p
                class="font-bold text-red-300"
            >
                No se pudo cargar el ranking
            </p>


            <p
                id="error-text"
                class="text-xs text-red-200 mt-2 break-words"
            >
            </p>

        </div>

    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer
        class="mt-auto pt-8 text-xs text-indigo-300"
    >

        By:

        <span
            class="font-bold text-pink-400"
        >
            Marcenaroc64
        </span>

    </footer>



    <!-- =========================
         FIREBASE
    ========================== -->

    <script type="module">


        import {
            initializeApp
        }
        from
        "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";


        import {
            getFirestore,
            collection,
            collectionGroup,
            getDocs,
            doc,
            getDoc
        }
        from
        "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";


        /*
        ============================================
        CONFIGURACIÓN DE FIREBASE
        ============================================

        IMPORTANTE:

        COPIA EXACTAMENTE LA MISMA CONFIGURACIÓN
        firebaseConfig QUE ESTÁ EN TU index.html.

        Busca en index.html:

        const firebaseConfig = {

        ...

        };

        Y COPIA TODO EL BLOQUE AQUÍ.
        */


        const firebaseConfig = {

             apiKey: "AIzaSyC7hjuWiRx3uBdfKAS3mj9na6zqO6xtQUY",
             authDomain: "palabra-secre.firebaseapp.com",
             projectId: "palabra-secre",
             storageBucket: "palabra-secre.firebasestorage.app",
             messagingSenderId: "1057501011597",
            appId: "1:1057501011597:web:ab2dd815a8ad9a293cccc4"


        };



        /*
        ============================================
        INICIALIZAR FIREBASE
        ============================================
        */


        const app =
            initializeApp(
                firebaseConfig
            );


        const db =
            getFirestore(
                app
            );



        /*
        ============================================
        ELEMENTOS HTML
        ============================================
        */


        const loading =
            document.getElementById(
                "loading"
            );


        const rankingContainer =
            document.getElementById(
                "ranking-container"
            );


        const rankingList =
            document.getElementById(
                "ranking-list"
            );


        const emptyRanking =
            document.getElementById(
                "empty-ranking"
            );


        const errorBox =
            document.getElementById(
                "error-box"
            );


        const errorText =
            document.getElementById(
                "error-text"
            );



        /*
        ============================================
        BOTÓN VOLVER
        ============================================
        */


        document
            .getElementById(
                "back-button"
            )
            .addEventListener(
                "click",
                () => {

                    /*
                    Va directamente al index.html
                    */

                    window.location.href =
                        "./index.html";

                }
            );



        /*
        ============================================
        MEDALLAS
        ============================================
        */


        function getPositionEmoji(
            position
        ) {


            if (
                position === 1
            ) {

                return "🥇";

            }


            if (
                position === 2
            ) {

                return "🥈";

            }


            if (
                position === 3
            ) {

                return "🥉";

            }


            return "#" + position;

        }



        /*
        ============================================
        CARGAR RANKING
        ============================================

        El juego original guarda:

        artifacts
        └── APP_ID
            └── users
                └── USER_ID
                    └── gameData
                        └── stats


        Por eso usamos collectionGroup("stats").
        */


        async function loadRanking() {


            try {


                /*
                ====================================
                BUSCAR TODAS LAS ESTADÍSTICAS
                ====================================
                */


                const statsSnapshot =
                    await getDocs(
                        collectionGroup(
                            db,
                            "stats"
                        )
                    );


                const players =
                    [];


                /*
                ====================================
                RECORRER ESTADÍSTICAS
                ====================================
                */


                for (
                    const statsDocument
                    of statsSnapshot.docs
                ) {


                    const data =
                        statsDocument.data();


                    /*
                    Obtener UID desde la ruta.

                    Ruta:

                    artifacts / appId / users / UID /
                    gameData / stats
                    */


                    const path =
                        statsDocument.ref.path.split(
                            "/"
                        );


                    /*
                    Buscar dónde aparece "users"
                    */


                    const usersIndex =
                        path.indexOf(
                            "users"
                        );


                    let userId =
                        null;


                    if (
                        usersIndex !== -1 &&
                        path[
                            usersIndex + 1
                        ]
                    ) {

                        userId =
                            path[
                                usersIndex + 1
                            ];

                    }



                    /*
                    ====================================
                    ESTADÍSTICAS
                    ====================================
                    */


                    const won =
                        Number(
                            data.won || 0
                        );


                    const lost =
                        Number(
                            data.lost || 0
                        );


                    const played =
                        Number(
                            data.played ||
                            won +
                            lost
                        );


                    /*
                    Solo jugadores que hayan jugado
                    */


                    if (
                        played <= 0
                    ) {

                        continue;

                    }



                    /*
                    ====================================
                    NOMBRE
                    ====================================

                    Por defecto usamos:

                    "Jugador"

                    Si más adelante guardas el nombre
                    en Firestore, aquí podremos mostrarlo.
                    */


                    let playerName =
                        "Jugador";


                    /*
                    Intentar usar un nombre
                    guardado en las estadísticas
                    */


                    if (
                        data.displayName
                    ) {

                        playerName =
                            data.displayName;

                    }


                    else if (
                        data.name
                    ) {

                        playerName =
                            data.name;

                    }


                    else if (
                        data.username
                    ) {

                        playerName =
                            data.username;

                    }



                    /*
                    ====================================
                    PORCENTAJE DE VICTORIA
                    ====================================
                    */


                    const winRate =
                        (
                            won /
                            played
                        ) * 100;



                    /*
                    Agregar jugador
                    */


                    players.push(
                        {


                            id:
                                userId ||
                                statsDocument.id,


                            name:
                                playerName,


                            won:
                                won,


                            played:
                                played,


                            lost:
                                lost,


                            winRate:
                                winRate

                        }
                    );

                }



                /*
                ====================================
                ORDENAR
                ====================================

                1. Mayor porcentaje
                2. Más victorias
                3. Más partidas jugadas
                */


                players.sort(
                    (
                        a,
                        b
                    ) => {


                        if (
                            b.winRate !==
                            a.winRate
                        ) {

                            return (
                                b.winRate -
                                a.winRate
                            );

                        }


                        if (
                            b.won !==
                            a.won
                        ) {

                            return (
                                b.won -
                                a.won
                            );

                        }


                        return (
                            b.played -
                            a.played
                        );

                    }
                );



                /*
                ====================================
                TOP 10
                ====================================
                */


                const topPlayers =
                    players.slice(
                        0,
                        10
                    );



                /*
                Ocultar carga
                */


                loading.classList.add(
                    "hidden"
                );



                /*
                ====================================
                SI NO HAY JUGADORES
                ====================================
                */


                if (
                    topPlayers.length === 0
                ) {


                    emptyRanking
                        .classList
                        .remove(
                            "hidden"
                        );


                    return;

                }



                /*
                ====================================
                MOSTRAR RANKING
                ====================================
                */


                rankingContainer
                    .classList
                    .remove(
                        "hidden"
                    );



                /*
                ====================================
                CREAR FILAS
                ====================================
                */


                topPlayers.forEach(
                    (
                        player,
                        index
                    ) => {


                        const position =
                            index + 1;


                        const positionText =
                            getPositionEmoji(
                                position
                            );



                        /*
                        ====================================
                        ESTILO POR POSICIÓN
                        ====================================
                        */


                        let positionClass =
                            "bg-white/10 border-white/10";


                        if (
                            position === 1
                        ) {


                            positionClass =
                                "bg-yellow-500/20 border-yellow-400/40";


                        }


                        else if (
                            position === 2
                        ) {


                            positionClass =
                                "bg-slate-300/10 border-slate-300/30";


                        }


                        else if (
                            position === 3
                        ) {


                            positionClass =
                                "bg-amber-700/20 border-amber-500/40";


                        }



                        /*
                        ====================================
                        CREAR FILA
                        ====================================
                        */


                        const row =
                            document.createElement(
                                "div"
                            );



                        row.className =
                            `ranking-row grid grid-cols-5 gap-2 items-center text-center p-3 rounded-xl border ${positionClass}`;



                        row.innerHTML =
                            `

                            <div class="font-black text-sm md:text-base">

                                ${positionText}

                            </div>


                            <div class="truncate font-bold text-xs md:text-sm text-indigo-100">

                                ${player.name}

                            </div>


                            <div class="font-bold text-emerald-400 text-xs md:text-sm">

                                ${player.won}

                            </div>


                            <div class="font-bold text-indigo-200 text-xs md:text-sm">

                                ${player.played}

                            </div>


                            <div class="font-black text-yellow-300 text-xs md:text-sm">

                                ${player.winRate.toFixed(
                                    1
                                )}%

                            </div>

                            `;



                        rankingList.appendChild(
                            row
                        );

                    }
                );


            }


            catch (
                error
            ) {


                console.error(
                    "Error cargando ranking:",
                    error
                );



                loading.classList.add(
                    "hidden"
                );


                errorBox.classList.remove(
                    "hidden"
                );


                errorText.textContent =
                    error.message;

            }

        }



        /*
        ============================================
        INICIAR RANKING
        ============================================
        */


        loadRanking();


    </script>


</body>
</html>
