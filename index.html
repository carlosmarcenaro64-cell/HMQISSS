        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap');
        body {
            font-family: 'Outfit', sans-serif;
            touch-action: manipulation;
        }
        .pop-animation {
            animation: pop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0.7; }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); opacity: 1; }
        }
        .shake-animation {
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .flip-tile {
            animation: flip 0.6s ease-in-out forwards;
        }
        @keyframes flip {
            0% { transform: rotateX(0deg); }
            50% { transform: rotateX(90deg); background-color: #334155; }
            100% { transform: rotateX(0deg); }
        }
        .pulse-glow {
            animation: pulseGlow 2s infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(234, 179, 8, 0.3); }
            50% { box-shadow: 0 0 25px rgba(234, 179, 8, 0.6); }
        }
    </style>
</head>

            { word: "LIBERTAD", clue: "Facultad natural para actuar sin coacción." },
            { word: "SECRETO", clue: "Cosa que se tiene reservada y oculta." },
            { word: "AMISTAD", clue: "Relación de afecto entre dos o más personas." },
            { word: "VERDAD", clue: "Conformidad de las cosas con el concepto que de ellas se tiene." },
            { word: "CIENCIA", clue: "Conjunto de conocimientos obtenidos mediante observación." },
            { word: "POESIA", clue: "Manifestación de la belleza por medio de la palabra." },
            { word: "PINTURA", clue: "Arte de representar escenas en superficies." },
            { word: "ESCALA", clue: "Sucesión ordenada de elementos o medidas." },
            { word: "IMAGEN", clue: "Figura, representación o aspecto visual." },
            { word: "MASCARA", clue: "Objeto para cubrir el rostro y ocultar identidad." },
            { word: "BOLSILLO", clue: "Pequeña bolsa cosida en prendas de vestir." },
            { word: "BRUJULA", clue: "Instrumento para orientarse que señala el norte." },
            { word: "DISEÑO", clue: "Proceso de creación visual de objetos o webs." },
            { word: "ENERGIA", clue: "Capacidad para obrar, transformar o poner en movimiento." },
            { word: "FAMILIA", grupo: "Grupo de personas unidas por parentesco." },
            { word: "GLOBO", clue: "Cuerpo esférico inflable o representación del planeta." },
            { word: "HISTORIA", clue: "Narración de los sucesos pasados de la humanidad." },
            { word: "ISLANDA", clue: "Referencia a tierras insulares o norteñas." },
            { word: "JUSTICIA", clue: "Principio moral que inclina a dar a cada uno lo suyo." },
            { word: "LAMPARA", clue: "Aparato que produce luz artificial." },
            { word: "MARTES", clue: "Segundo día de la semana laboral." },
            { word: "NEURONA", clue: "Célula principal del sistema nervioso." },
            { word: "OXIGENO", clue: "Gas vital que respiramos para vivir." },
            { word: "PIRATE", clue: "Navegante corsario que asalta en alta mar." },
            { word: "QUIMICA", clue: "Ciencia que estudia la composición de la materia." },
            { word: "REGALO", clue: "Obsequio que se da a alguien sin esperar pago." },
            { word: "SISTEMA", clue: "Conjunto de reglas o elementos ordenados." },
            { word: "TEATRO", clue: "Edificio o arte donde se representan obras dramáticas." },
            { word: "UNIDAD", clue: "Propiedad de ser uno e indivisible." },
            { word: "VERANO", clue: "Estación más cálida del año." },
            { word: "WEBCAM", clue: "Cámara digital conectada a un ordenador." },
            { word: "YACURA", clue: "Voz tradicional de depósitos de agua." },
            { word: "ZAPATO", clue: "Calzado que protege el pie." },

            // 7 Letras y más (Palabras Largas y Complejas)
            { word: "MISTERIO", clue: "Enigma oculto que espera ser revelado." },
            { word: "UNIVERSO", clue: "Todo lo que existe, sin fin ni límites." },
            { word: "AVENTURA", clue: "Viaje emocionante hacia lo desconocido." },
            { word: "LABERINTO", clue: "Red de caminos donde es fácil perderse." },
            { word: "HORIZONTE", clue: "Línea imaginaria donde la tierra toca el cielo." },
            { word: "DINASTIA", clue: "Serie de soberanos de una misma familia." },
            { word: "ARQUITECTO", clue: "Profesional que diseña edificios y estructuras." },
            { word: "COMPETENCIA", clue: "Disputa entre varios que aspiran a un mismo objetivo." },
            { word: "BIBLIOTECA", clue: "Lugar lleno de libros para leer y estudiar." },
            { word: "ASTRONAUTA", clue: "Persona que viaja al espacio exterior." },
            { word: "VOLCAN", clue: "Montaña con apertura por donde emerge magma." },
            { word: "DINOSAURIO", clue: "Antiguo reptil gigante extinto hace millones de años." },
            { word: "MEDITACION", clue: "Práctica para entrenar la mente y lograr paz." },
            { word: "TERREMOTO", clue: "Sacudida violunda de la corteza terrestre." },
            { word: "SATELITE", clue: "Objeto que orbita alrededor de un planeta." },
            { word: "CURRICULUM", clue: "Resumen de experiencias laborales y académicas." },
            { word: "PARADOJA", clue: "Idea extraña opuesta a la opinión general." },
            { word: "METEORITO", clue: "Roca espacial que impacta contra un planeta." },
            { word: "ESPEJISMO", clue: "Ilusión óptica debida al calor y la refracción." },
            { word: "SIMULACION", clue: "Reproducción artificial de un fenómeno." }
        ];

        // Rellenar dinámicamente con más variantes de palabras comunes si es necesario, 
        // separando por longitudes para equilibrar el juego.
        const shortWords = masterWords.filter(item => item.word.length >= 3 && item.word.length <= 5);
        const longWords = masterWords.filter(item => item.word.length >= 6);

        let selectedObj = {};
        let secretWord = "";
        let currentGuess = "";
        let currentRow = 0;
        let isGameOver = false;
        const totalRows = 6;
        let wordLength = 5;

        const boardEl = document.getElementById("board");
        const hintBoxEl = document.getElementById("hint-box");
        const clueTextEl = document.getElementById("clue-text");
        const subtitleInfoEl = document.getElementById("subtitle-info");
        const messageEl = document.getElementById("game-message");
        const restartBtn = document.getElementById("restart-btn");

        function initGame() {
            // Probabilidad: 30% cortas (3-5 letras) / 70% largas (6+ letras)
            const randProbability = Math.random() * 100;
            let pool = randProbability < 30 ? shortWords : longWords;
            
            selectedObj = pool[Math.floor(Math.random() * pool.length)];
            secretWord = selectedObj.word;
            wordLength = secretWord.length;
            
            // Ocultar pista al iniciar
            hintBoxEl.classList.add("opacity-0", "scale-95", "pointer-events-none");
            clueTextEl.textContent = "...";

            subtitleInfoEl.textContent = `Palabra de ${wordLength} letras • 6 intentos (${masterWords.length}+ palabras)`;
            
            currentGuess = "";
            currentRow = 0;
            isGameOver = false;
            
            messageEl.style.opacity = "0";
            restartBtn.classList.add("hidden");

            // Resetear colores del teclado virtual
            document.querySelectorAll(".key-btn").forEach(btn => {
                if (btn.dataset.key !== "ENTER" && btn.dataset.key !== "BACK") {
                    btn.className = "key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md";
                }
            });

            buildBoard();
        }

        function buildBoard() {
            boardEl.innerHTML = "";
            for (let r = 0; r < totalRows; r++) {
                const rowDiv = document.createElement("div");
                rowDiv.className = `grid gap-1.5 w-full`;
                rowDiv.style.gridTemplateColumns = `repeat(${wordLength}, minmax(0, 1fr))`;

                for (let c = 0; c < wordLength; c++) {
                    const cell = document.createElement("div");
                    // Tamaño dinámico de celda adaptable a la pantalla del móvil
                    cell.className = "border-2 border-white/20 rounded-lg aspect-square flex items-center justify-center text-lg md:text-xl font-extrabold uppercase bg-white/5 transition-all duration-300 shadow-inner";
                    cell.id = `cell-${r}-${c}`;
                    rowDiv.appendChild(cell);
                }
                boardEl.appendChild(rowDiv);
            }
        }

        function showMessage(text, duration = 2000) {
            messageEl.textContent = text;
            messageEl.style.opacity = "1";
            if (duration) {
                setTimeout(() => {
                    messageEl.style.opacity = "0";
                }, duration);
            }
        }

        function handleKeyPress(key) {
            if (isGameOver) return;

            if (key === "ENTER") {
                if (currentGuess.length !== wordLength) {
                    showMessage("Faltan letras");
                    shakeCurrentRow();
                    return;
                }
                checkGuess();
            } else if (key === "BACK") {
                if (currentGuess.length > 0) {
                    currentGuess = currentGuess.slice(0, -1);
                    updateBoardUI();
                }
            } else {
                if (currentGuess.length < wordLength && /^[A-ZÑ]$/.test(key)) {
                    currentGuess += key;
                    updateBoardUI();
                    popCurrentCell();
                }
            }
        }

        function updateBoardUI() {
            for (let c = 0; c < wordLength; c++) {
                const cell = document.getElementById(`cell-${currentRow}-${c}`);
                if (c < currentGuess.length) {
                    cell.textContent = currentGuess[c];
                    cell.classList.add("border-white/60", "bg-white/10");
                } else {
                    cell.textContent = "";
                    cell.classList.remove("border-white/60", "bg-white/10");
                }
            }
        }

        function popCurrentCell() {
            if (currentGuess.length > 0) {
                const cell = document.getElementById(`cell-${currentRow}-${currentGuess.length - 1}`);
                cell.classList.add("pop-animation");
                setTimeout(() => cell.classList.remove("pop-animation"), 200);
            }
        }

        function shakeCurrentRow() {
            for (let c = 0; c < wordLength; c++) {
                const cell = document.getElementById(`cell-${currentRow}-${c}`);
                cell.classList.add("shake-animation");
                setTimeout(() => cell.classList.remove("shake-animation"), 400);
            }
        }

        function checkGuess() {
            const guess = currentGuess;
            const secretArr = secretWord.split("");
            const guessArr = guess.split("");
            const status = Array(wordLength).fill("absent");

            // Verificar aciertos exactos (Verde)
            for (let i = 0; i < wordLength; i++) {
                if (guessArr[i] === secretArr[i]) {
                    status[i] = "correct";
                    secretArr[i] = null;
                }
            }

            // Verificar letras presentes en otro lugar (Amarillo)
            for (let i = 0; i < wordLength; i++) {
                if (status[i] !== "correct") {
                    const index = secretArr.indexOf(guessArr[i]);
                    if (index > -1) {
                        status[i] = "present";
                        secretArr[index] = null;
                    }
                }
            }

            // Aplicar animación de volteo y colores en las celdas
            for (let i = 0; i < wordLength; i++) {
                const cell = document.getElementById(`cell-${currentRow}-${i}`);
                const letter = guessArr[i];
                const keyBtn = document.querySelector(`[data-key="${letter}"]`);

                setTimeout(() => {
                    cell.classList.add("flip-tile");
                    
                    setTimeout(() => {
                        if (status[i] === "correct") {
                            cell.className = "border-2 border-emerald-500 bg-emerald-500 text-white rounded-lg aspect-square flex items-center justify-center text-lg md:text-xl font-extrabold uppercase shadow-lg";
                            if (keyBtn && !keyBtn.classList.contains("bg-emerald-600")) {
                                keyBtn.className = "key-btn flex-1 bg-emerald-600 hover:bg-emerald-500 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md text-white";
                            }
                        } else if (status[i] === "present") {
                            cell.className = "border-2 border-amber-500 bg-amber-500 text-slate-950 rounded-lg aspect-square flex items-center justify-center text-lg md:text-xl font-extrabold uppercase shadow-lg";
                            if (keyBtn && !keyBtn.classList.contains("bg-emerald-600") && !keyBtn.classList.contains("bg-amber-600")) {
                                keyBtn.className = "key-btn flex-1 bg-amber-600 hover:bg-amber-500 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md text-white";
                            }
                        } else {
                            cell.className = "border-2 border-slate-700 bg-slate-800 text-white/40 rounded-lg aspect-square flex items-center justify-center text-lg md:text-xl font-extrabold uppercase";
                            if (keyBtn && !keyBtn.classList.contains("bg-emerald-600") && !keyBtn.classList.contains("bg-amber-600")) {
                                keyBtn.className = "key-btn flex-1 bg-slate-800 hover:bg-slate-700 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md text-white/40";
                            }
                        }
                    }, 300);
                }, i * 150);
            }

            // Comprobar Victoria o Derrota
            setTimeout(() => {
                if (guess === secretWord) {
                    showMessage("🎉 ¡Increíble, ganaste!", 0);
                    isGameOver = true;
                    restartBtn.classList.remove("hidden");
                    return;
                }

                currentRow++;
                currentGuess = "";

                // Si pasamos al último intento, revelamos la pista con animación
                if (currentRow === totalRows - 1) {
                    clueTextEl.textContent = selectedObj.clue;
                    hintBoxEl.classList.remove("opacity-0", "scale-95", "pointer-events-none");
                    showMessage("⚠️ ¡Última oportunidad con pista!", 3500);
                }

                if (currentRow === totalRows) {
                    showMessage(`❌ ¡Juego terminado! Era: ${secretWord}`, 0);
                    isGameOver = true;
                    restartBtn.classList.remove("hidden");
                }
            }, wordLength * 150 + 300);
        }

        // Eventos de Teclado Físico y del Teléfono
        document.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                handleKeyPress("ENTER");
            } else if (e.key === "Backspace") {
                handleKeyPress("BACK");
            } else {
                const key = e.key.toUpperCase();
                if (/^[A-ZÑ]$/.test(key)) {
                    handleKeyPress(key);
                }
            }
        });

        // Eventos de Teclado Virtual en Pantalla
        document.querySelectorAll(".key-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                const key = btn.dataset.key;
                handleKeyPress(key);
            });
        });

        // Inicializar el juego al cargar
        window.onload = initGame;
    </script>
</body>
</html>
