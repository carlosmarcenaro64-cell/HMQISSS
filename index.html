<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivina la Palabra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap');
        body {
            font-family: 'Outfit', sans-serif;
        }
        .pop-animation {
            animation: pop 0.2s ease-in-out;
        }
        @keyframes pop {
            0% { transform: scale(0.9); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .shake-animation {
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-slate-900 min-h-screen text-white flex flex-col justify-between items-center p-4">

    <!-- Cabecera -->
    <header class="w-full max-w-md text-center py-4">
        <h1 class="text-3xl md:text-4xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-yellow-300">
            PALABRA SECRETA
        </h1>
        <p id="subtitle-info" class="text-xs md:text-sm text-indigo-200 mt-1">Adivina la palabra oculta</p>
    </header>

    <!-- Contenedor Principal del Juego -->
    <main class="w-full max-w-md flex flex-col items-center gap-6 my-auto">
        
        <!-- Pista Actual -->
        <div id="hint-box" class="bg-white/10 backdrop-blur-md border border-white/20 rounded-xl px-4 py-2 text-center text-sm text-yellow-200 font-medium shadow-lg w-full">
            💡 Pista: <span id="clue-text">Cargando pista...</span>
        </div>

        <!-- Cuadrícula del Tablero (Se ajustará dinámicamente) -->
        <div id="board" class="w-full max-w-[340px] mx-auto flex flex-col gap-2">
            <!-- Las filas y celdas se generan dinámicamente mediante JS -->
        </div>

        <!-- Mensajes de Estado / Notificaciones -->
        <div id="message-container" class="h-8 flex items-center justify-center">
            <span id="game-message" class="text-sm font-semibold px-4 py-1 rounded-full bg-black/40 backdrop-blur text-pink-300 opacity-0 transition-opacity duration-300"></span>
        </div>

        <!-- Teclado Virtual en Pantalla -->
        <div id="keyboard" class="w-full flex flex-col gap-1.5 select-none">
            <!-- Fila 1 -->
            <div class="flex justify-center gap-1 w-full">
                <button data-key="Q" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow">Q</button>
                <button data-key="W" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow">W</button>
                <button data-key="E" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow">E</button>
                <button data-key="R" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow">R</button>
                <button data-key="T" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow">T</button>
                <button data-key="Y" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow">Y</button>
                <button data-key="U" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow">U</button>
                <button data-key="I" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow">I</button>
                <button data-key="O" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow">O</button>
                <button data-key="P" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow">P</button>
            </div>
            <!-- Fila 2 -->
            <div class="flex justify-center gap-1 w-full px-4">
                <button data-key="A" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow">A</button>
                <button data-key="S" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow">S</button>
                <button data-key="D" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow">D</button>
                <button data-key="F" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow">F</button>
                <button data-key="G" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow">G</button>
                <button data-key="H" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow">H</button>
                <button data-key="J" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow">J</button>
                <button data-key="K" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow">K</button>
                <button data-key="L" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow">L</button>
                <button data-key="Ñ" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow">Ñ</button>
            </div>
            <!-- Fila 3 -->
            <div class="flex justify-center gap-1 w-full">
                <button data-key="ENTER" class="key-btn flex-[1.5] bg-indigo-600 hover:bg-indigo-500 active:scale-95 transition font-bold py-3 rounded-lg text-xs md:text-sm shadow">ENTER</button>
                <button data-key="Z" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow">Z</button>
                <button data-key="X" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow">X</button>
                <button data-key="C" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow">C</button>
                <button data-key="V" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow">V</button>
                <button data-key="B" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow">B</button>
                <button data-key="N" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow">N</button>
                <button data-key="M" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow">M</button>
                <button data-key="BACK" class="key-btn flex-[1.5] bg-rose-600 hover:bg-rose-500 active:scale-95 transition font-bold py-3 rounded-lg text-xs md:text-sm shadow">⌫</button>
            </div>
        </div>

        <!-- Botón Reiniciar -->
        <button id="restart-btn" onclick="initGame()" class="hidden bg-gradient-to-r from-pink-500 to-yellow-500 hover:opacity-90 active:scale-95 text-slate-950 font-bold px-8 py-3 rounded-xl shadow-lg transition">
            Jugar Nuevamente
        </button>

    </main>

    <!-- Pie de página -->
    <footer class="text-xs text-indigo-300/60 py-2">
        Creado con estilo y diversión ✨
    </footer>

    <!-- Lógica del Juego -->
    <script>
        const wordsList = [
            { word: "SOL", clue: "Estrella brillante que ilumina el día" },
            { word: "CASA", clue: "Lugar donde vivimos y nos resguardamos" },
            { word: "PERRO", clue: "El mejor amigo del hombre" },
            { word: "PLAYA", clue: "Lugar con arena, sol y mar" },
            { word: "LIBRO", clue: "Objeto lleno de historias y páginas" },
            { word: "FUEGO", clue: "Elemento caliente que da luz y calor" },
            { word: "NUBES", clue: "Acumulaciones de vapor en el cielo" },
            { word: "ARBOL", clue: "Planta gigante con tronco y ramas" },
            { word: "LUNA", clue: "Satélite natural que brilla de noche" },
            { word: "MUSICA", clue: "Arte de combinar sonidos y ritmos" },
            { word: "TIGRE", clue: "Felino salvaje con rayas naranjas y negras" },
            { word: "AVION", clue: "Medio de transporte que vuela por el aire" },
            { word: "PLANETA", clue: "Cuerpo celeste que gira alrededor de una estrella" }
        ];

        let selectedObj = {};
        let secretWord = "";
        let currentGuess = "";
        let currentRow = 0;
        let isGameOver = false;
        const totalRows = 6;
        let wordLength = 5;

        const boardEl = document.getElementById("board");
        const clueTextEl = document.getElementById("clue-text");
        const subtitleInfoEl = document.getElementById("subtitle-info");
        const messageEl = document.getElementById("game-message");
        const restartBtn = document.getElementById("restart-btn");

        function initGame() {
            // Seleccionar palabra aleatoria
            selectedObj = wordsList[Math.floor(Math.random() * wordsList.length)];
            secretWord = selectedObj.word;
            wordLength = secretWord.length;
            
            clueTextEl.textContent = selectedObj.clue;
            subtitleInfoEl.textContent = `Adivina la palabra oculta de ${wordLength} letras en 6 intentos`;
            
            currentGuess = "";
            currentRow = 0;
            isGameOver = false;
            
            messageEl.style.opacity = "0";
            restartBtn.classList.add("hidden");

            // Resetear colores del teclado virtual
            document.querySelectorAll(".key-btn").forEach(btn => {
                if (btn.dataset.key !== "ENTER" && btn.dataset.key !== "BACK") {
                    btn.className = "key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow";
                }
            });

            buildBoard();
        }

        function buildBoard() {
            boardEl.innerHTML = "";
            for (let r = 0; r < totalRows; r++) {
                const rowDiv = document.createElement("div");
                rowDiv.className = `grid grid-cols-${wordLength} gap-2 w-full`;
                // Asignar estilo en línea de columnas dinámicas para asegurar compatibilidad exacta con Tailwind
                rowDiv.style.gridTemplateColumns = `repeat(${wordLength}, minmax(0, 1fr))`;

                for (let c = 0; c < wordLength; c++) {
                    const cell = document.createElement("div");
                    // Altura y proporción dinámica basada en la cantidad de letras
                    cell.className = "border-2 border-white/20 rounded-xl aspect-square flex items-center justify-center text-lg md:text-2xl font-bold uppercase bg-white/5 transition-all duration-300";
                    cell.id = `cell-${r}-${c}`;
                    rowDiv.appendChild(cell);
                }
                boardEl.appendChild(rowDiv);
            }
        }

        function showMessage(text, duration = 2000) {
            messageEl.textContent = text;
            messageEl.style.opacity = "1";
            if (duration) {
                setTimeout(() => {
                    messageEl.style.opacity = "0";
                }, duration);
            }
        }

        function handleKeyPress(key) {
            if (isGameOver) return;

            if (key === "ENTER") {
                if (currentGuess.length !== wordLength) {
                    showMessage("Faltan letras");
                    shakeCurrentRow();
                    return;
                }
                checkGuess();
            } else if (key === "BACK") {
                if (currentGuess.length > 0) {
                    currentGuess = currentGuess.slice(0, -1);
                    updateBoardUI();
                }
            } else {
                if (currentGuess.length < wordLength && /^[A-ZÑ]$/.test(key)) {
                    currentGuess += key;
                    updateBoardUI();
                    popCurrentCell();
                }
            }
        }

        function updateBoardUI() {
            for (let c = 0; c < wordLength; c++) {
                const cell = document.getElementById(`cell-${currentRow}-${c}`);
                if (c < currentGuess.length) {
                    cell.textContent = currentGuess[c];
                    cell.classList.add("border-white/60");
                } else {
                    cell.textContent = "";
                    cell.classList.remove("border-white/60");
                }
            }
        }

        function popCurrentCell() {
            if (currentGuess.length > 0) {
                const cell = document.getElementById(`cell-${currentRow}-${currentGuess.length - 1}`);
                cell.classList.add("pop-animation");
                setTimeout(() => cell.classList.remove("pop-animation"), 200);
            }
        }

        function shakeCurrentRow() {
            for (let c = 0; c < wordLength; c++) {
                const cell = document.getElementById(`cell-${currentRow}-${c}`);
                cell.classList.add("shake-animation");
                setTimeout(() => cell.classList.remove("shake-animation"), 400);
            }
        }

        function checkGuess() {
            const guess = currentGuess;
            const secretArr = secretWord.split("");
            const guessArr = guess.split("");
            const status = Array(wordLength).fill("absent");

            // Primero verificar aciertos exactos (Verde)
            for (let i = 0; i < wordLength; i++) {
                if (guessArr[i] === secretArr[i]) {
                    status[i] = "correct";
                    secretArr[i] = null;
                }
            }

            // Segundo verificar letras presentes en otro lugar (Amarillo)
            for (let i = 0; i < wordLength; i++) {
                if (status[i] !== "correct") {
                    const index = secretArr.indexOf(guessArr[i]);
                    if (index > -1) {
                        status[i] = "present";
                        secretArr[index] = null;
                    }
                }
            }

            // Aplicar colores en las celdas con animación secuencial
            for (let i = 0; i < wordLength; i++) {
                const cell = document.getElementById(`cell-${currentRow}-${i}`);
                const letter = guessArr[i];
                const keyBtn = document.querySelector(`[data-key="${letter}"]`);

                setTimeout(() => {
                    if (status[i] === "correct") {
                        cell.className = "border-2 border-emerald-500 bg-emerald-500 text-white rounded-xl aspect-square flex items-center justify-center text-lg md:text-2xl font-bold uppercase transition-all duration-300";
                        if (keyBtn && !keyBtn.classList.contains("bg-emerald-600")) {
                            keyBtn.className = "key-btn flex-1 bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow text-white";
                        }
                    } else if (status[i] === "present") {
                        cell.className = "border-2 border-amber-500 bg-amber-500 text-slate-950 rounded-xl aspect-square flex items-center justify-center text-lg md:text-2xl font-bold uppercase transition-all duration-300";
                        if (keyBtn && !keyBtn.classList.contains("bg-emerald-600") && !keyBtn.classList.contains("bg-amber-600")) {
                            keyBtn.className = "key-btn flex-1 bg-amber-600 hover:bg-amber-500 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow text-white";
                        }
                    } else {
                        cell.className = "border-2 border-slate-600 bg-slate-700/50 text-white/50 rounded-xl aspect-square flex items-center justify-center text-lg md:text-2xl font-bold uppercase transition-all duration-300";
                        if (keyBtn && !keyBtn.classList.contains("bg-emerald-600") && !keyBtn.classList.contains("bg-amber-600")) {
                            keyBtn.className = "key-btn flex-1 bg-slate-700 hover:bg-slate-600 active:scale-95 transition font-bold py-3 rounded-lg text-sm md:text-base shadow text-white/50";
                        }
                    }
                }, i * 200);
            }

            // Comprobar Victoria o Derrota
            setTimeout(() => {
                if (guess === secretWord) {
                    showMessage("🎉 ¡Felicidades, ganaste!", 0);
                    isGameOver = true;
                    restartBtn.classList.remove("hidden");
                    return;
                }

                currentRow++;
                currentGuess = "";

                if (currentRow === totalRows) {
                    showMessage(`❌ ¡Juego terminado! Era: ${secretWord}`, 0);
                    isGameOver = true;
                    restartBtn.classList.remove("hidden");
                }
            }, wordLength * 200);
        }

        // Eventos de Teclado Físico
        document.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                handleKeyPress("ENTER");
            } else if (e.key === "Backspace") {
                handleKeyPress("BACK");
            } else {
                const key = e.key.toUpperCase();
                if (/^[A-ZÑ]$/.test(key)) {
                    handleKeyPress(key);
                }
            }
        });

        // Eventos de Teclado Virtual en Pantalla
        document.querySelectorAll(".key-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                const key = btn.dataset.key;
                handleKeyPress(key);
            });
        });

        // Inicializar el juego al cargar
        window.onload = initGame;
    </script>
</body>
</html>
