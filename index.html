<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Llamados - Hospital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .pulse-soft { animation: pulseSoft 2s infinite; }
        @keyframes pulseSoft {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <div id="app" class="flex-1 flex flex-col"></div>

    <script>
        // URL de tu aplicación web de Google Apps Script configurada
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycblzar7aNPOpi7ym0DzigrnFxloogmUuhLqzivAYQXJJSnJLWa4JGDnLYZ3xMbSjbyw/exec';

        let state = {
            view: 'selector',
            currentCall: { ticket: '---', name: '', location: 'Seleccione un destino', time: '--:--' },
            history: []
        };

        let currentSelectedDestination = 'Consultorio 01';

        function setMode(mode) {
            state.view = mode;
            if (mode === 'operator') renderOperator();
            else renderTV();
        }

        function renderSelector() {
            const app = document.getElementById('app');
            app.className = "flex-1 flex items-center justify-center p-4 md:p-6 bg-gradient-to-br from-slate-900 via-blue-950 to-indigo-950";
            app.innerHTML = `
                <div class="max-w-4xl w-full bg-slate-800/85 backdrop-blur-xl border border-slate-700 p-6 md:p-12 rounded-3xl shadow-2xl text-center">
                    <h1 class="text-2xl md:text-5xl font-black text-white tracking-tight mb-4">Gestión de Turnos (Google Sheets)</h1>
                    <p class="text-slate-400 text-sm md:text-lg mb-8 max-w-xl mx-auto">Selecciona el modo de uso para este dispositivo.</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <button onclick="setMode('operator')" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 text-white p-6 md:p-8 rounded-2xl shadow-xl text-left flex flex-col justify-between">
                            <div>
                                <div class="text-2xl mb-4">📱</div>
                                <h3 class="text-xl md:text-2xl font-bold mb-2">Control Remoto (Celular)</h3>
                                <p class="text-blue-100 text-sm">Envía turnos directo a la hoja de cálculo.</p>
                            </div>
                            <div class="mt-6 text-sm font-semibold text-blue-200">Abrir Control &rarr;</div>
                        </button>
                        <button onclick="setMode('tv')" class="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 text-white p-6 md:p-8 rounded-2xl shadow-xl text-left flex flex-col justify-between">
                            <div>
                                <div class="text-2xl mb-4">📺</div>
                                <h3 class="text-xl md:text-2xl font-bold mb-2">Pantalla de Sala (TV)</h3>
                                <p class="text-emerald-100 text-sm">Se actualiza automáticamente desde Sheets y emite voz.</p>
                            </div>
                            <div class="mt-6 text-sm font-semibold text-emerald-200">Iniciar TV &rarr;</div>
                        </button>
                    </div>
                </div>
            `;
        }

        function renderOperator() {
            const app = document.getElementById('app');
            app.className = "flex-1 flex flex-col bg-slate-900 p-3 md:p-6 max-w-2xl mx-auto w-full";
            
            let consultoriosOptions = '';
            for(let i = 1; i <= 12; i++) {
                const name = `Consultorio ${i < 10 ? '0'+i : i}`;
                consultoriosOptions += `<option value="${name}" ${currentSelectedDestination === name ? 'selected' : ''}>🚪 ${name}</option>`;
            }

            app.innerHTML = `
                <header class="flex justify-between items-center bg-slate-800 border border-slate-700 px-4 py-3 rounded-2xl shadow-lg mb-4">
                    <div class="flex items-center space-x-2">
                        <span class="text-2xl">📱</span>
                        <h2 class="text-base font-bold text-white">Control Remoto Cloud</h2>
                    </div>
                    <button onclick="setMode('selector')" class="px-3 py-1.5 bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold">Menú</button>
                </header>
                <div class="space-y-4 flex-1 flex flex-col justify-between">
                    <div class="bg-slate-800/90 border border-slate-700 p-4 md:p-6 rounded-2xl shadow-xl space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Número de Turno</label>
                            <input type="text" id="ticketInput" placeholder="Ej. A-012" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-lg font-black uppercase focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Nombre del Paciente (Opcional)</label>
                            <input type="text" id="nameInput" placeholder="Ej. Juan Pérez" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-base focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Destino</label>
                            <select id="mobileDestSelect" onchange="currentSelectedDestination = this.value" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white font-bold focus:outline-none focus:border-blue-500">
                                ${consultoriosOptions}
                            </select>
                        </div>
                        <button onclick="sendToSheet()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 text-white font-black py-4 rounded-xl shadow-lg text-lg transition-transform active:scale-95">
                            📢 LLAMAR TURNO
                        </button>
                    </div>
                </div>
            `;
        }

        async function sendToSheet() {
            const ticketVal = document.getElementById('ticketInput').value.trim();
            const nameVal = document.getElementById('nameInput').value.trim();
            if (!ticketVal) { alert("Ingrese el turno"); return; }

            const now = new Date();
            const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const payload = {
                ticket: ticketVal.toUpperCase(),
                name: nameVal,
                location: currentSelectedDestination,
                time: timeString
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                alert("¡Turno enviado a la nube con éxito!");
                document.getElementById('ticketInput').value = '';
                document.getElementById('nameInput').value = '';
            } catch(e) {
                alert("Error al enviar el turno.");
            }
        }

        function renderTV() {
            const app = document.getElementById('app');
            app.className = "flex-1 flex flex-col bg-slate-950 text-white p-6 justify-between";
            app.innerHTML = `
                <header class="flex justify-between items-center border-b border-slate-800 pb-4">
                    <div class="flex items-center space-x-4">
                        <div class="bg-blue-600 text-white font-black px-4 py-2 rounded-xl text-xl shadow-lg">HMQ</div>
                        <div>
                            <h1 class="text-2xl font-bold">Sala de Espera - Conectado a Google Sheets</h1>
                            <p class="text-slate-400 text-sm">Actualización automática en tiempo real</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <div id="tvClock" class="text-3xl font-black text-blue-400">00:00:00</div>
                        <button onclick="setMode('selector')" class="text-xs text-slate-500 hover:text-slate-300 mt-1">Configuración</button>
                    </div>
                </header>
                <div class="my-auto py-8">
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-center bg-gradient-to-r from-blue-900/40 via-indigo-900/30 to-slate-900 border-2 border-blue-500/50 rounded-3xl p-8 lg:p-12 shadow-2xl pulse-soft">
                        <div class="text-center lg:text-left border-b lg:border-b-0 lg:border-r border-blue-500/30 pb-6 lg:pr-8">
                            <span class="text-blue-400 font-bold uppercase text-sm block mb-2">TURNO ACTUAL</span>
                            <div id="tvCurrentTicket" class="text-6xl md:text-8xl font-black text-white">---</div>
                            <div id="tvCurrentName" class="text-2xl md:text-3xl font-bold text-slate-200 mt-2"></div>
                        </div>
                        <div class="text-center lg:text-left">
                            <span class="text-emerald-400 font-bold uppercase text-sm block mb-2">DESTINO</span>
                            <div id="tvCurrentLocation" class="text-4xl md:text-6xl font-black text-emerald-300">Esperando...</div>
                        </div>
                    </div>
                </div>
            `;
            startClock();
            pollSheetData();
            setInterval(pollSheetData, 3000); // Revisa la hoja cada 3 segundos
        }

        let lastCheckedTicket = '';
        async function pollSheetData() {
            try {
                const res = await fetch(SCRIPT_URL);
                const data = await res.json();
                
                document.getElementById('tvCurrentTicket').innerText = data.ticket;
                document.getElementById('tvCurrentName').innerText = data.name || '';
                document.getElementById('tvCurrentLocation').innerText = data.location;

                if (data.ticket !== '---' && data.ticket !== lastCheckedTicket) {
                    lastCheckedTicket = data.ticket;
                    speakCall(data.ticket, data.name, data.location);
                }
            } catch(e) {}
        }

        function speakCall(ticket, name, location) {
            playChime();
            if ('speechSynthesis' in window) {
                setTimeout(() => {
                    let text = `Turno ${ticket}.`;
                    if (name) text += ` Paciente ${name}.`;
                    text += ` Dirigirse a ${location}.`;
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'es-ES';
                    utterance.rate = 0.95;
                    window.speechSynthesis.speak(utterance);
                }, 600);
            }
        }

        function startClock() {
            setInterval(() => {
                const clockEl = document.getElementById('tvClock');
                if (clockEl) clockEl.innerText = new Date().toLocaleTimeString();
            }, 1000);
        }

        function playChime() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);
            } catch(e) {}
        }

        window.onload = function() { renderSelector(); }
    </script>
</body>
</html>
