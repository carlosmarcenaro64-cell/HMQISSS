<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Policlínico - ISSS</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .card { background: white; padding: 2.5rem; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { color: #003366; margin-bottom: 1.5rem; text-align: center; }
        
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.5rem; color: #333; font-weight: 600; }
        input { width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        
        button { width: 100%; padding: 0.75rem; background-color: #003366; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #002244; }
        
        .error { color: #d9534f; margin-bottom: 1rem; font-size: 0.9rem; text-align: center; display: none; }
        
        /* Dashboard Options Grid */
        .menu-grid { display: grid; gap: 1rem; margin-top: 1rem; }
        .menu-btn { background-color: #ffffff; border: 2px solid #003366; color: #003366; font-weight: bold; text-align: left; padding: 1rem; border-radius: 6px; }
        .menu-btn:hover { background-color: #003366; color: white; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="login-section" class="card">
        <h2>Acceso al Sistema ISSS</h2>
        <div id="error-msg" class="error">Usuario o contraseña incorrectos.</div>
        <form id="login-form">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" required placeholder="Ingrese su usuario">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="Ingrese su contraseña">
            </div>
            <button type="submit">Iniciar Sesión</button>
        </form>
    </div>

    <div id="dashboard-section" class="card hidden" style="max-width: 600px;">
        <h2>Menú Principal</h2>
        <div class="menu-grid">
            <button class="menu-btn" onclick="navegar('Constancias de Permanencia')">1. Constancias de Permanencia</button>
            <button class="menu-btn" onclick="navegar('Listado QR')">2. Listado QR</button>
            <button class="menu-btn" onclick="navegar('Información de Pacientes')">3. Información de Pacientes</button>
            <button class="menu-btn" onclick="navegar('Pantallas')">4. Pantallas</button>
            <button class="menu-btn" onclick="navegar('Domiciliar')">5. Domiciliar</button>
            <button class="menu-btn" onclick="navegar('Web Impacto')">6. Web Impacto</button>
            <button class="menu-btn" onclick="navegar('Agenda Médica')">7. Agenda Médica</button>
        </div>
    </div>

    <script>
        const USER_VALIDO = "HMQ.ISSS.sv";
        const PASS_VALIDO = "Hmqisss2026";

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            if (user === USER_VALIDO && pass === PASS_VALIDO) {
                errorMsg.style.display = 'none';
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
            } else {
                errorMsg.style.display = 'block';
            }
        });

        function navegar(modulo) {
            alert(`Accediendo al módulo: ${modulo}`);
        }
    </script>
</body>
</html>
