<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Llamados - Hospital (Modo Local)</title>
    <!-- Tailwind CSS para diseño moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .pulse-soft {
            animation: pulseSoft 2s infinite;
        }
        @keyframes pulseSoft {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <div id="app" class="flex-1 flex flex-col">
        <!-- Contenido dinámico inyectado por JS -->
    </div>

    <script>
        // Estado local de la aplicación
        let state = {
            view: 'selector', // 'selector', 'operator', 'tv'
            currentCall: {
                ticket: '---',
                location: 'Seleccione un destino',
                time: '--:--'
            },
            history: []
        };

        // Cargar estado guardado al iniciar
        function loadState() {
            const savedState = localStorage.getItem('hospital_call_state_local');
            if (savedState) {
                try {
                    state = JSON.parse(savedState);
                } catch(e) { console.error(e); }
            }
        }

        function saveState() {
            localStorage.setItem('hospital_call_state_local', JSON.stringify(state));
        }

        function renderSelector() {
            const app = document.getElementById('app');
            app.className = "flex-1 flex items-center justify-center p-6 bg-gradient-to-br from-slate-900 via-blue-950 to-indigo-950";
            app.innerHTML = `
                <div class="max-w-4xl w-full bg-slate-800/80 backdrop-blur-xl border border-slate-700 p-8 md:p-12 rounded-3xl shadow-2xl text-center">
                    <div class="inline-flex items-center justify-center p-4 bg-blue-600/20 text-blue-400 rounded-2xl mb-6 shadow-inner">
                        <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                    </div>
                    <h1 class="text-3xl md:text-5xl font-black text-white tracking-tight mb-4">Gestión de Turnos (Red Local / Bloc de Notas)</h1>
                    <p class="text-slate-400 text-lg mb-10 max-w-xl mx-auto">Selecciona cómo funcionará este dispositivo para evitar bloqueos del Firewall.</p>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <button onclick="setMode('operator')" class="group relative overflow-hidden bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white p-8 rounded-2xl shadow-xl transition-all duration-300 transform hover:-translate-y-1 text-left flex flex-col justify-between border border-blue-400/30">
                            <div>
                                <div class="w-12 h-12 rounded-xl bg-white/10 flex items-center justify-center mb-4 text-2xl">📝</div>
                                <h3 class="text-2xl font-bold mb-2">Panel Operador (PC / Bloc de notas)</h3>
                                <p class="text-blue-100 text-sm opacity-90">Genera o carga el archivo <code class="bg-blue-900 px-1 rounded">llamado.txt</code> para actualizar las pantallas.</p>
                            </div>
                            <div class="mt-6 flex items-center text-sm font-semibold text-blue-200 group-hover:translate-x-2 transition-transform">
                                Abrir Panel Operador &rarr;
                            </div>
                        </button>

                        <button onclick="setMode('tv')" class="group relative overflow-hidden bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white p-8 rounded-2xl shadow-xl transition-all duration-300 transform hover:-translate-y-1 text-left flex flex-col justify-between border border-emerald-400/30">
                            <div>
                                <div class="w-12 h-12 rounded-xl bg-white/10 flex items-center justify-center mb-4 text-2xl">📺</div>
                                <h3 class="text-2xl font-bold mb-2">Pantalla Sala de Espera (Google TV)</h3>
                                <p class="text-emerald-100 text-sm opacity-90">Muestra en grande los turnos y lee automáticamente los archivos de texto actualizados.</p>
                            </div>
                            <div class="mt-6 flex items-center text-sm font-semibold text-emerald-200 group-hover:translate-x-2 transition-transform">
                                Iniciar Pantalla TV &rarr;
                            </div>
                        </button>
                    </div>
                </div>
            `;
        }

        function setMode(mode) {
            state.view = mode;
            saveState();
            if (mode === 'operator') renderOperator();
            else renderTV();
        }

        function renderOperator() {
            const app = document.getElementById('app');
            app.className = "flex-1 flex flex-col bg-slate-900 p-6 max-w-4xl mx-auto w-full";
            app.innerHTML = `
                <header class="flex justify-between items-center bg-slate-800 border border-slate-700 px-6 py-4 rounded-2xl shadow-lg mb-6">
                    <div class="flex items-center space-x-3">
                        <span class="text-3xl">📝</span>
                        <div>
                            <h2 class="text-xl font-bold text-white">Panel Operador con Bloc de Notas</h2>
                            <p class="text-xs text-slate-400">Actualiza las pantallas de la sala sin salir a internet</p>
                        </div>
                    </div>
                    <button onclick="setMode('selector')" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-xl text-sm font-semibold transition-colors">
                        Menú Principal
                    </button>
                </header>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 flex-1">
                    <!-- Generar Turno y Archivo -->
                    <div class="bg-slate-800/90 border border-slate-700 p-6 rounded-2xl shadow-xl flex flex-col justify-between">
                        <div>
                            <h3 class="text-lg font-bold text-white mb-4">1. Generar Turno para Bloc de Notas</h3>
                            
                            <div class="mb-4">
                                <label class="block text-sm font-medium text-slate-400 mb-2">Número de Turno / Paciente</label>
                                <input type="text" id="txtTicket" placeholder="Ej. A-015" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-lg font-bold uppercase focus:outline-none focus:border-blue-500">
                            </div>

                            <div class="mb-4">
                                <label class="block text-sm font-medium text-slate-400 mb-2">Destino / Consultorio</label>
                                <select id="txtLocation" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white font-bold focus:outline-none focus:border-blue-500">
                                    <option value="Área: Selección de Pacientes">📋 Área: Selección de Pacientes</option>
                                    ${Array.from({length: 12}, (_, i) => `<option value="Consultorio ${i+1 < 10 ? '0'+(i+1) : i+1}">🚪 Consultorio ${i+1 < 10 ? '0'+(i+1) : i+1}</option>`).join('')}
                                </select>
                            </div>
                        </div>

                        <button onclick="downloadCallFile()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-4 rounded-xl shadow-lg transition-transform active:scale-95 flex items-center justify-center space-x-2 text-base">
                            <span>📥 Descargar Archivo (llamado.txt)</span>
                        </button>
                    </div>

                    <!-- Cargar Archivo en el TV / Pantalla -->
                    <div class="bg-slate-800/90 border border-slate-700 p-6 rounded-2xl shadow-xl flex flex-col justify-between">
                        <div>
                            <h3 class="text-lg font-bold text-white mb-4">2. Actualizar en los Televisores</h3>
                            <p class="text-xs text-slate-400 mb-4">En los Google TV, abre esta misma página en el navegador, selecciona <strong class="text-white">Pantalla Sala de Espera</strong>, y arrastra o selecciona el archivo <code class="text-blue-300">llamado.txt</code> que creaste para que suene la campana y se actualice al instante.</p>

                            <div class="bg-slate-900/80 border border-slate-700 p-4 rounded-xl mb-4">
                                <span class="text-xs text-slate-400 block mb-1">Turno Actual en Memoria:</span>
                                <div class="text-2xl font-black text-white">${state.currentCall.ticket}</div>
                                <div class="text-sm text-emerald-400 font-semibold">${state.currentCall.location}</div>
                            </div>
                        </div>

                        <button onclick="setMode('tv')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition-all">
                            📺 Ver Pantalla de Televisor Ahora
                        </button>
                    </div>
                </div>
            `;
        }

        function downloadCallFile() {
            const ticket = document.getElementById('txtTicket').value.trim().toUpperCase();
            const location = document.getElementById('txtLocation').value;
            if (!ticket) {
                alertBox("Ingrese el número de turno");
                return;
            }

            const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            state.history.unshift(state.currentCall);
            if (state.history.length > 4) state.history.pop();
            state.currentCall = { ticket, location, time: now };
            saveState();

            // Crear y descargar archivo llamado.txt para el bloc de notas
            const fileContent = `TURNO: ${ticket}\nDESTINO: ${location}\nHORA: ${now}`;
            const blob = new Blob([fileContent], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "llamado.txt";
            a.click();

            alertBox(`Turno ${ticket} guardado en llamado.txt con éxito`);
            document.getElementById('txtTicket').value = '';
        }

        function renderTV() {
            const app = document.getElementById('app');
            app.className = "flex-1 flex flex-col bg-slate-950 text-white p-6 justify-between overflow-hidden";
            app.innerHTML = `
                <header class="flex justify-between items-center border-b border-slate-800 pb-4">
                    <div class="flex items-center space-x-4">
                        <div class="bg-blue-600 text-white font-black px-4 py-2 rounded-xl text-xl shadow-lg">HMQ</div>
                        <div>
                            <h1 class="text-2xl font-bold tracking-tight">Sala de Espera - Consultorios Médicos</h1>
                            <p class="text-slate-400 text-sm">Carga tu archivo <code class="text-blue-300">llamado.txt</code> aquí para actualizar los turnos</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4">
                        <label class="cursor-pointer bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-lg transition-all flex items-center space-x-2">
                            <span>📂 Cargar llamado.txt</span>
                            <input type="file" accept=".txt" onchange="handleTVFileLoad(event)" class="hidden">
                        </label>
                        <div class="text-right">
                            <div id="tvClock" class="text-2xl font-black text-blue-400">00:00:00</div>
                            <button onclick="setMode('selector')" class="text-[10px] text-slate-500 hover:text-slate-300">Menú</button>
                        </div>
                    </div>
                </header>

                <div class="my-auto py-8">
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-center bg-gradient-to-r from-blue-900/40 via-indigo-900/30 to-slate-900 border-2 border-blue-500/50 rounded-3xl p-8 lg:p-12 shadow-2xl pulse-soft">
                        <div class="text-center lg:text-left border-b lg:border-b-0 lg:border-r border-blue-500/30 pb-6 lg:pb-0 lg:pr-8">
                            <span class="text-blue-400 font-bold tracking-widest uppercase text-sm md:text-base block mb-2">TURNO ACTUAL</span>
                            <div id="tvCurrentTicket" class="text-6xl md:text-8xl font-black text-white tracking-wider drop-shadow-lg">
                                ${state.currentCall.ticket}
                            </div>
                        </div>
                        <div class="text-center lg:text-left">
                            <span class="text-emerald-400 font-bold tracking-widest uppercase text-sm md:text-base block mb-2">DESTINO / CONSULTORIO</span>
                            <div id="tvCurrentLocation" class="text-4xl md:text-6xl font-black text-emerald-300 drop-shadow-lg leading-tight">
                                ${state.currentCall.location}
                            </div>
                        </div>
                    </div>
                </div>

                <footer class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 shadow-xl">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 flex items-center">
                        <span class="w-2 h-2 bg-slate-500 rounded-full inline-block mr-2"></span>
                        Últimos Llamados Recientes
                    </h3>
                    <div id="tvHistoryList" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        ${state.history.filter(h => h.ticket && h.ticket !== '---').length === 0 ? 
                            `<div class="text-slate-500 text-sm italic col-span-3 text-center py-2">Sin llamados previos cargados. Sube tu archivo .txt</div>` :
                            state.history.filter(h => h.ticket && h.ticket !== '---').slice(0, 3).map(item => `
                                <div class="bg-slate-800/90 border border-slate-700/60 rounded-xl p-3 flex justify-between items-center">
                                    <div>
                                        <div class="text-xl font-black text-white">${item.ticket}</div>
                                        <div class="text-xs text-slate-400 truncate max-w-[180px]">${item.location}</div>
                                    </div>
                                    <div class="text-xs text-slate-500 font-mono">${item.time}</div>
                                </div>
                            `).join('')
                        }
                    </div>
                </footer>
            `;
            startClock();
        }

        function handleTVFileLoad(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                let ticket = "TURNO";
                let location = "Consultorio";

                const lines = text.split('\n');
                lines.forEach(line => {
                    if (line.toLowerCase().includes('turno')) ticket = line.split(':')[1]?.trim().toUpperCase() || ticket;
                    if (line.toLowerCase().includes('destino')) location = line.split(':')[1]?.trim() || location;
                });

                const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                state.history.unshift(state.currentCall);
                if (state.history.length > 4) state.history.pop();
                state.currentCall = { ticket, location, time: now };
                saveState();
                playChime();
                renderTV();
            };
            reader.readAsText(file);
        }

        function startClock() {
            setInterval(() => {
                const clockEl = document.getElementById('tvClock');
                if (clockEl) {
                    const now = new Date();
                    clockEl.innerText = now.toLocaleTimeString();
                }
            }, 1000);
        }

        function alertBox(msg) {
            const box = document.createElement('div');
            box.className = "fixed bottom-6 right-6 bg-blue-600 text-white px-6 py-3 rounded-xl shadow-2xl font-bold z-50 transition-all";
            box.innerText = msg;
            document.body.appendChild(box);
            setTimeout(() => box.remove(), 3000);
        }

        function playChime() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);

                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);
            } catch(e) {}
        }

        window.onload = function() {
            loadState();
            if (state.view === 'operator') renderOperator();
            else if (state.view === 'tv') renderTV();
            else renderSelector();
        }
    </script>
</body>
</html>
