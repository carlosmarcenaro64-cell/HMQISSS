<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adivina la Palabra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap');
        body {
            font-family: 'Outfit', sans-serif;
            touch-action: manipulation;
        }
        .pop-animation {
            animation: pop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0.7; }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); opacity: 1; }
        }
        .shake-animation {
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .flip-tile {
            animation: flip 0.6s ease-in-out forwards;
        }
        @keyframes flip {
            0% { transform: rotateX(0deg); }
            50% { transform: rotateX(90deg); background-color: #334155; }
            100% { transform: rotateX(0deg); }
        }
        .pulse-glow {
            animation: pulseGlow 2s infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(234, 179, 8, 0.3); }
            50% { box-shadow: 0 0 25px rgba(234, 179, 8, 0.6); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-950 via-purple-950 to-slate-950 min-h-screen text-white flex flex-col justify-between items-center p-3 select-none overflow-x-hidden">

    <!-- Cabecera -->
    <header class="w-full max-w-md text-center py-2">
        <h1 class="text-2xl md:text-3xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-purple-300 to-yellow-300 drop-shadow-sm">
            PALABRA SECRETA
        </h1>
        <p id="subtitle-info" class="text-xs text-indigo-200 mt-0.5">Adivina la palabra oculta</p>
    </header>

    <!-- Contenedor Principal del Juego -->
    <main class="w-full max-w-md flex flex-col items-center gap-4 my-auto">
        
        <!-- Pista Actual (Oculta hasta el último intento) -->
        <div id="hint-box" class="bg-white/15 backdrop-blur-md border border-yellow-400/30 rounded-xl px-4 py-2.5 text-center text-xs md:text-sm text-yellow-200 font-medium shadow-lg w-full transition-all duration-500 opacity-0 scale-95 pointer-events-none pulse-glow">
            🔮 <span class="font-bold">Pista final:</span> <span id="clue-text" class="italic">...</span>
        </div>

        <!-- Cuadrícula del Tablero (Se ajustará dinámicamente) -->
        <div id="board" class="w-full max-w-[320px] mx-auto flex flex-col gap-1.5 justify-center items-center">
            <!-- Las filas y celdas se generan dinámicamente mediante JS -->
        </div>

        <!-- Mensajes de Estado / Notificaciones -->
        <div id="message-container" class="h-7 flex items-center justify-center">
            <span id="game-message" class="text-xs md:text-sm font-semibold px-4 py-1 rounded-full bg-black/50 backdrop-blur border border-white/10 text-pink-300 opacity-0 transition-all duration-300 shadow-md"></span>
        </div>

        <!-- Teclado Virtual en Pantalla (Diseño optimizado para móvil) -->
        <div id="keyboard" class="w-full flex flex-col gap-1.5 max-w-md px-1">
            <!-- Fila 1 -->
            <div class="flex justify-center gap-1 w-full">
                <button data-key="Q" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">Q</button>
                <button data-key="W" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">W</button>
                <button data-key="E" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">E</button>
                <button data-key="R" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">R</button>
                <button data-key="T" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">T</button>
                <button data-key="Y" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">Y</button>
                <button data-key="U" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">U</button>
                <button data-key="I" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">I</button>
                <button data-key="O" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">O</button>
                <button data-key="P" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">P</button>
            </div>
            <!-- Fila 2 -->
            <div class="flex justify-center gap-1 w-full px-3">
                <button data-key="A" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">A</button>
                <button data-key="S" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">S</button>
                <button data-key="D" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">D</button>
                <button data-key="F" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">F</button>
                <button data-key="G" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">G</button>
                <button data-key="H" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">H</button>
                <button data-key="J" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">J</button>
                <button data-key="K" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">K</button>
                <button data-key="L" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">L</button>
                <button data-key="Ñ" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">Ñ</button>
            </div>
            <!-- Fila 3 -->
            <div class="flex justify-center gap-1 w-full">
                <button data-key="ENTER" class="key-btn flex-[1.5] bg-indigo-600 hover:bg-indigo-500 active:scale-90 transition-all font-bold py-3 rounded-lg text-[10px] md:text-xs shadow-md">ENTER</button>
                <button data-key="Z" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">Z</button>
                <button data-key="X" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">X</button>
                <button data-key="C" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">C</button>
                <button data-key="V" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">V</button>
                <button data-key="B" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">B</button>
                <button data-key="N" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">N</button>
                <button data-key="M" class="key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">M</button>
                <button data-key="BACK" class="key-btn flex-[1.5] bg-rose-600 hover:bg-rose-500 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md">⌫</button>
            </div>
        </div>

        <!-- Botón Reiniciar -->
        <button id="restart-btn" onclick="initGame()" class="hidden bg-gradient-to-r from-pink-500 to-yellow-400 hover:opacity-95 active:scale-95 text-slate-950 font-bold px-8 py-3 rounded-xl shadow-xl transition-all tracking-wide text-sm animate-bounce">
            ✨ Jugar Nuevamente
        </button>

    </main>

    <!-- Pie de página -->
    <footer class="text-[10px] text-indigo-300/50 py-1">
        Palabra Secreta • Versión Móvil Optimizada
    </footer>

    <!-- Lógica del Juego -->
    <script>
        // Listado de palabras agrupadas por longitud (Cortas: 3-5 letras | Largas: 6-10 letras)
        const shortWords = [
            { word: "SOL", clue: "Aparece cuando la oscuridad se retira." },
            { word: "PAN", clue: "Alimento básico hecho de harina y fuego." },
            { word: "LUZ", clue: "Lo primero que vence a las sombras." },
            { word: "CASA", clue: "Refugio que guarda memorias en paredes." },
            { word: "LUNA", clue: "Espejo nocturno que vigila los sueños." },
            { word: "AGUA", clue: "Líquido esencial que da vida al mundo." },
            { word: "PERRO", clue: "Compañero leal de cuatro patas." },
            { word: "PLAYA", clue: "Donde las huellas se borran con marea." },
            { word: "LIBRO", clue: "Universo silencioso hecho de hojas." },
            { word: "FUEGO", clue: "Energía indomable que danza y consume." },
            { word: "NUBES", clue: "Almohadas pasajeras que navegan alto." },
            { word: "ARBOL", clue: "Testigo silencioso que respira al cielo." }
        ];

        const longWords = [
            { word: "MUSICA", clue: "Vibración invisible que conmueve el alma." },
            { word: "TIGRE", clue: "Sombra rayada que acecha en espesura." },
            { word: "AVION", clue: "Ave metálica que cruza las nubes." },
            { word: "PLANETA", clue: "Esfera rodante en el vasto cosmos." },
            { word: "GALAXIA", clue: "Gigantesco remolino de estrellas y polvo." },
            { word: "MISTERIO", clue: "Enigma oculto que espera ser revelado." },
            { word: "UNIVERSO", clue: "Todo lo que existe, sin fin ni límites." },
            { word: "AVENTURA", clue: "Viaje emocionante hacia lo desconocido." },
            { word: "LABERINTO", clue: "Red de caminos donde es fácil perderse." },
            { word: "TORMENTA", clue: "Furia intensa de viento, lluvia y truenos." },
            { word: "DIAMANTE", clue: "Piedra preciosa nacida bajo profunda presión." },
            { word: "HORIZONTE", clue: "Línea imaginaria donde la tierra toca el cielo." }
        ];

        let selectedObj = {};
        let secretWord = "";
        let currentGuess = "";
        let currentRow = 0;
        let isGameOver = false;
        const totalRows = 6;
        let wordLength = 5;

        const boardEl = document.getElementById("board");
        const hintBoxEl = document.getElementById("hint-box");
        const clueTextEl = document.getElementById("clue-text");
        const subtitleInfoEl = document.getElementById("subtitle-info");
        const messageEl = document.getElementById("game-message");
        const restartBtn = document.getElementById("restart-btn");

        function initGame() {
            // Probabilidad solicitada: 35% de 3-5 letras / 65% de 6-10 letras
            const randProbability = Math.random() * 100;
            let pool = randProbability < 35 ? shortWords : longWords;
            
            selectedObj = pool[Math.floor(Math.random() * pool.length)];
            secretWord = selectedObj.word;
            wordLength = secretWord.length;
            
            // Ocultar pista al iniciar
            hintBoxEl.classList.add("opacity-0", "scale-95", "pointer-events-none");
            clueTextEl.textContent = "...";

            subtitleInfoEl.textContent = `Palabra de ${wordLength} letras • 6 intentos`;
            
            currentGuess = "";
            currentRow = 0;
            isGameOver = false;
            
            messageEl.style.opacity = "0";
            restartBtn.classList.add("hidden");

            // Resetear colores del teclado virtual
            document.querySelectorAll(".key-btn").forEach(btn => {
                if (btn.dataset.key !== "ENTER" && btn.dataset.key !== "BACK") {
                    btn.className = "key-btn flex-1 bg-white/20 hover:bg-white/30 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md";
                }
            });

            buildBoard();
        }

        function buildBoard() {
            boardEl.innerHTML = "";
            for (let r = 0; r < totalRows; r++) {
                const rowDiv = document.createElement("div");
                rowDiv.className = `grid gap-1.5 w-full`;
                rowDiv.style.gridTemplateColumns = `repeat(${wordLength}, minmax(0, 1fr))`;

                for (let c = 0; c < wordLength; c++) {
                    const cell = document.createElement("div");
                    // Tamaño dinámico de celda adaptable a la pantalla del móvil
                    cell.className = "border-2 border-white/20 rounded-lg aspect-square flex items-center justify-center text-lg md:text-xl font-extrabold uppercase bg-white/5 transition-all duration-300 shadow-inner";
                    cell.id = `cell-${r}-${c}`;
                    rowDiv.appendChild(cell);
                }
                boardEl.appendChild(rowDiv);
            }
        }

        function showMessage(text, duration = 2000) {
            messageEl.textContent = text;
            messageEl.style.opacity = "1";
            if (duration) {
                setTimeout(() => {
                    messageEl.style.opacity = "0";
                }, duration);
            }
        }

        function handleKeyPress(key) {
            if (isGameOver) return;

            if (key === "ENTER") {
                if (currentGuess.length !== wordLength) {
                    showMessage("Faltan letras");
                    shakeCurrentRow();
                    return;
                }
                checkGuess();
            } else if (key === "BACK") {
                if (currentGuess.length > 0) {
                    currentGuess = currentGuess.slice(0, -1);
                    updateBoardUI();
                }
            } else {
                if (currentGuess.length < wordLength && /^[A-ZÑ]$/.test(key)) {
                    currentGuess += key;
                    updateBoardUI();
                    popCurrentCell();
                }
            }
        }

        function updateBoardUI() {
            for (let c = 0; c < wordLength; c++) {
                const cell = document.getElementById(`cell-${currentRow}-${c}`);
                if (c < currentGuess.length) {
                    cell.textContent = currentGuess[c];
                    cell.classList.add("border-white/60", "bg-white/10");
                } else {
                    cell.textContent = "";
                    cell.classList.remove("border-white/60", "bg-white/10");
                }
            }
        }

        function popCurrentCell() {
            if (currentGuess.length > 0) {
                const cell = document.getElementById(`cell-${currentRow}-${currentGuess.length - 1}`);
                cell.classList.add("pop-animation");
                setTimeout(() => cell.classList.remove("pop-animation"), 200);
            }
        }

        function shakeCurrentRow() {
            for (let c = 0; c < wordLength; c++) {
                const cell = document.getElementById(`cell-${currentRow}-${c}`);
                cell.classList.add("shake-animation");
                setTimeout(() => cell.classList.remove("shake-animation"), 400);
            }
        }

        function checkGuess() {
            const guess = currentGuess;
            const secretArr = secretWord.split("");
            const guessArr = guess.split("");
            const status = Array(wordLength).fill("absent");

            // Verificar aciertos exactos (Verde)
            for (let i = 0; i < wordLength; i++) {
                if (guessArr[i] === secretArr[i]) {
                    status[i] = "correct";
                    secretArr[i] = null;
                }
            }

            // Verificar letras presentes en otro lugar (Amarillo)
            for (let i = 0; i < wordLength; i++) {
                if (status[i] !== "correct") {
                    const index = secretArr.indexOf(guessArr[i]);
                    if (index > -1) {
                        status[i] = "present";
                        secretArr[index] = null;
                    }
                }
            }

            // Aplicar animación de volteo y colores en las celdas
            for (let i = 0; i < wordLength; i++) {
                const cell = document.getElementById(`cell-${currentRow}-${i}`);
                const letter = guessArr[i];
                const keyBtn = document.querySelector(`[data-key="${letter}"]`);

                setTimeout(() => {
                    cell.classList.add("flip-tile");
                    
                    setTimeout(() => {
                        if (status[i] === "correct") {
                            cell.className = "border-2 border-emerald-500 bg-emerald-500 text-white rounded-lg aspect-square flex items-center justify-center text-lg md:text-xl font-extrabold uppercase shadow-lg";
                            if (keyBtn && !keyBtn.classList.contains("bg-emerald-600")) {
                                keyBtn.className = "key-btn flex-1 bg-emerald-600 hover:bg-emerald-500 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md text-white";
                            }
                        } else if (status[i] === "present") {
                            cell.className = "border-2 border-amber-500 bg-amber-500 text-slate-950 rounded-lg aspect-square flex items-center justify-center text-lg md:text-xl font-extrabold uppercase shadow-lg";
                            if (keyBtn && !keyBtn.classList.contains("bg-emerald-600") && !keyBtn.classList.contains("bg-amber-600")) {
                                keyBtn.className = "key-btn flex-1 bg-amber-600 hover:bg-amber-500 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md text-white";
                            }
                        } else {
                            cell.className = "border-2 border-slate-700 bg-slate-800 text-white/40 rounded-lg aspect-square flex items-center justify-center text-lg md:text-xl font-extrabold uppercase";
                            if (keyBtn && !keyBtn.classList.contains("bg-emerald-600") && !keyBtn.classList.contains("bg-amber-600")) {
                                keyBtn.className = "key-btn flex-1 bg-slate-800 hover:bg-slate-700 active:scale-90 transition-all font-bold py-3 rounded-lg text-xs md:text-sm shadow-md text-white/40";
                            }
                        }
                    }, 300);
                }, i * 150);
            }

            // Comprobar Victoria o Derrota
            setTimeout(() => {
                if (guess === secretWord) {
                    showMessage("🎉 ¡Increíble, ganaste!", 0);
                    isGameOver = true;
                    restartBtn.classList.remove("hidden");
                    return;
                }

                currentRow++;
                currentGuess = "";

                // Si pasamos al último intento, revelamos la pista con animación
                if (currentRow === totalRows - 1) {
                    clueTextEl.textContent = selectedObj.clue;
                    hintBoxEl.classList.remove("opacity-0", "scale-95", "pointer-events-none");
                    showMessage("⚠️ ¡Última oportunidad con pista!", 3500);
                }

                if (currentRow === totalRows) {
                    showMessage(`❌ ¡Juego terminado! Era: ${secretWord}`, 0);
                    isGameOver = true;
                    restartBtn.classList.remove("hidden");
                }
            }, wordLength * 150 + 300);
        }

        // Eventos de Teclado Físico y del Teléfono
        document.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                handleKeyPress("ENTER");
            } else if (e.key === "Backspace") {
                handleKeyPress("BACK");
            } else {
                const key = e.key.toUpperCase();
                if (/^[A-ZÑ]$/.test(key)) {
                    handleKeyPress(key);
                }
            }
        });

        // Eventos de Teclado Virtual en Pantalla
        document.querySelectorAll(".key-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                const key = btn.dataset.key;
                handleKeyPress(key);
            });
        });

        // Inicializar el juego al cargar
        window.onload = initGame;
    </script>
</body>
</html>
